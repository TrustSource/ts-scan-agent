[build-system]
requires = [
    'setuptools>=61.0',
    'setuptools-scm>=8.0'
]
build-backend = 'setuptools.build_meta'

[project]
name = 'ts-scan-agent'
version = '0.1.0'
authors = [
    { name='EACG GmbH' }
]
description = 'Proposes a TrustSource scan concept (projects, modules, infrastructure modules, linked modules) for an arbitrary repository'
readme = 'README.md'
requires-python = '>=3.10'
classifiers = []
keywords = ['TrustSource', 'SCA', 'SBOM', 'scan concept', 'ts-scan']
license = 'Apache-2.0'

dependencies = [
    "click==8.1.7",
    "pydantic>=2.0,<3",
    "httpx~=0.27.0",
    "ts-scan>=1.8.0"
]

[project.optional-dependencies]
anthropic = [
    "anthropic>=1.0.0,<2"
]

[project.urls]
Homepage = 'https://github.com/trustsource/ts-scan-agent.git'

[project.scripts]
ts-scan-agent = "ts_scan_agent.cli:start"

[tool.setuptools.packages.find]
where = ['src']
